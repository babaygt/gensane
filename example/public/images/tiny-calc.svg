<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title">
  <title id="title">The expression 1 + (2 * 3) as a tree</title>
  <rect width="640" height="360" fill="#2e3440"/>
  <g font-family="ui-monospace, monospace" font-size="28" text-anchor="middle" fill="#eceff4">
    <path d="M320 80 200 180M320 80 440 180M440 180 370 280M440 180 510 280" stroke="#88c0d0" stroke-width="3"/>
    <circle cx="320" cy="80" r="32" fill="#5e81ac"/><text x="320" y="90">+</text>
    <circle cx="200" cy="180" r="32" fill="#4c566a"/><text x="200" y="190">1</text>
    <circle cx="440" cy="180" r="32" fill="#5e81ac"/><text x="440" y="190">*</text>
    <circle cx="370" cy="280" r="32" fill="#4c566a"/><text x="370" y="290">2</text>
    <circle cx="510" cy="280" r="32" fill="#4c566a"/><text x="510" y="290">3</text>
  </g>
</svg>
