{% extends "base.html" %}
{% block content %}
<h1>{{ page.title }}</h1>
<form class="search-form" action="{{ search }}" role="search">
<label for="search-query">Search for</label>
<input id="search-query" type="search" name="q" autocomplete="off">
<button type="submit">Search</button>
</form>
<p class="search-status" aria-live="polite"><noscript>Search needs JavaScript.</noscript></p>
<ol class="search-results"></ol>
<script type="module" src="/assets/search.js"></script>
{% endblock %}
