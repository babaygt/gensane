{# The bar that asks before Google Analytics counts a visit; assets/consent.js shows it and loads Google after "Allow". Both choices look the same, so saying no is as easy as saying yes. #}<section class="consent" aria-label="Cookies" data-google="{{ analytics.google }}" hidden>
<p>This site would like to count visits with Google Analytics, which sets cookies.</p>
<p class="consent-choices"><button type="button" data-consent="yes">Allow</button> <button type="button" data-consent="no">No thanks</button></p>
</section>
