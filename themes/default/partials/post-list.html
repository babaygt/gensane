<ul class="posts posts-{{ theme.blog.layout }}">
{% for post in pagination.items %}{% include "partials/post-item.html" %}
{% endfor %}</ul>
{% if pagination.total > 1 %}<nav class="pagination" aria-label="Pages">
{% if pagination.previousUrl %}<a href="{{ pagination.previousUrl }}" rel="prev">Newer posts</a>{% endif %}
<span>Page {{ pagination.current }} of {{ pagination.total }}</span>
{% if pagination.nextUrl %}<a href="{{ pagination.nextUrl }}" rel="next">Older posts</a>{% endif %}
</nav>
{% endif %}
